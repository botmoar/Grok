# Paste above the "# BEGIN WordPress" block in the site root .htaccess (Apache).
# Compression and long caching for static assets. Theme assets are versioned by
# file mtime (?ver=...), so a year of caching is safe.

<IfModule mod_deflate.c>
  AddOutputFilterByType DEFLATE text/html text/plain text/css text/xml application/xml application/rss+xml application/javascript application/json image/svg+xml font/woff2
</IfModule>

<IfModule mod_expires.c>
  ExpiresActive On
  ExpiresByType text/css "access plus 1 year"
  ExpiresByType application/javascript "access plus 1 year"
  ExpiresByType font/woff2 "access plus 1 year"
  ExpiresByType image/webp "access plus 1 year"
  ExpiresByType image/jpeg "access plus 1 year"
  ExpiresByType image/png "access plus 1 year"
  ExpiresByType image/svg+xml "access plus 1 year"
  ExpiresByType audio/mpeg "access plus 1 year"
</IfModule>

<IfModule mod_headers.c>
  <FilesMatch "\.(css|js|woff2|webp|jpe?g|png|svg|mp3)$">
    Header set Cache-Control "public, max-age=31536000, immutable"
  </FilesMatch>
  Header always set X-Content-Type-Options "nosniff"
  Header always set Referrer-Policy "strict-origin-when-cross-origin"
  Header always set X-Frame-Options "SAMEORIGIN"
  Header always set Permissions-Policy "camera=(), microphone=(), geolocation=()"
</IfModule>

# Block direct access to files that should never be served.
<FilesMatch "(^\.|wp-config\.php|readme\.html|license\.txt|debug\.log|\.(sql|bak|log|md|json|lock|sh|py|yml)$)">
  Require all denied
</FilesMatch>
Options -Indexes
